plugins {
    id 'fabric-loom' version '1.17.20'
}

version = '1.0.0'
group = 'com.azarasismp'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

// マッピング自体を無効化する設定
loom {
    accessWidenerPath = file("src/main/resources/azarasismp.accesswidener") // もし使ってたら。不要なら消してOK
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    
    // マッピングを使わない場合は dependencies から mappings 行自体を消すのが正解

    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc:fabric-api:0.115.0+26.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

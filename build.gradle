buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Fabric Loom内部のASMをJava 25対応バージョンに強制アップデート
        classpath 'org.objectweb.asm:asm:9.7'
        classpath 'org.objectweb.asm:asm-commons:9.7'
        classpath 'org.objectweb.asm:asm-tree:9.7'
        classpath 'org.objectweb.asm:asm-util:9.7'
    }
}

plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
}

version = '1.0.0'
group = 'com.azarasismp'

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    mappings 'net.fabricmc:yarn:26.2+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.115.0+26.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
